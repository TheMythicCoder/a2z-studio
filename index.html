<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A2Z Visual Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study tool, phone first
   IDEA a graph-paper coding notebook with a highlighter, split into five tabbed sections
   PICTURE Today: the day's ring and time bar; Learn: the live algorithm drawing on graph paper
   COLOUR white paper, ink navy, highlighter yellow, red pen, green tick, one hue per topic
   TYPE IBM Plex Sans + Plex Mono for code
   LAYOUT phone: one column, tab bar at the bottom; laptop: tabs on top, two columns */
:root{color-scheme:light dark;--bg:light-dark(#f4f5f8,#121419);--card:light-dark(#ffffff,#1b1e25);--paper:light-dark(#eceef3,#23272f);--grid:light-dark(#dfe3eb,#2c313b);--ink:light-dark(#1c2028,#e4e6eb);--mute:light-dark(#5a6272,#9da4b0);--line:light-dark(#dadee6,#2f343e);--acc:light-dark(#4353d6,#93a0ff);--accink:light-dark(#ffffff,#11131a);--hi:light-dark(#ffe27a,#d9b84a);--hiink:#1c2028;--red:light-dark(#cf443c,#f0827a);--grn:light-dark(#1a8f5c,#5ccb95);--ylw:light-dark(#c58a00,#e3bd5a);--ylwt:light-dark(#8a6100,#e3bd5a);--blue:var(--acc)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;padding-bottom:76px}
header{background:var(--card);color:var(--ink);padding:14px 16px;border-bottom:1px solid var(--line)}
header .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:clamp(22px,5.5vw,30px);line-height:1.05;letter-spacing:-.02em;margin:0}
.sub{font-size:14px;opacity:.85;margin-top:4px}
.ring text{fill:currentColor;font-family:"IBM Plex Sans",sans-serif}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{font:inherit;font-size:13px;min-height:60px;border:0;background:none;color:var(--mute);display:grid;justify-items:center;align-content:center;gap:2px;cursor:pointer;position:relative}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--acc);font-weight:700}
.tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--acc);border-radius:0 0 3px 3px}
.tabs .bdg{position:absolute;top:6px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:9px;font-size:13px;font-weight:700;min-width:20px;height:20px;line-height:20px;padding:0 5px}
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 24px}
h2{font-size:20px;line-height:1.2;margin:22px 0 10px;letter-spacing:-.01em}
h2:first-child{margin-top:4px}
h3{font-size:16px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:grid;gap:10px}
.cols{display:grid;gap:16px}
.btn{font:inherit;font-size:15px;min-height:44px;min-width:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.btn.wide{width:100%}
.btn:disabled{opacity:.4}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.small{font-size:13px;color:var(--mute)}
.daynav{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center;text-align:center}
.daynav b{font-size:20px}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.tbar{display:flex;height:16px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.tbar i{display:block}
.leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5em,1fr));gap:2px 10px;margin-top:8px;font-size:14px}
.leg i,.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;flex:none}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.qh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;margin-bottom:10px}
.qh .dot{margin-top:7px}
.nm{font-size:16px;font-weight:600;line-height:1.3}
.meta{font-size:13px;color:var(--mute)}
.tm{min-height:40px;font-size:14px;white-space:nowrap}
.tm.on{background:var(--red);border-color:var(--red);color:#fff}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:14px;font-weight:600;min-height:44px;border:0;border-left:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;padding:0 4px}
.seg .g{color:var(--grn)}.seg .y{color:var(--ylwt)}.seg .r{color:var(--red)}
.seg .a.on{background:var(--acc);color:var(--accink)}
.seg button:first-child{border-left:0}
.seg .g.on{background:var(--grn);color:#fff;font-weight:700}
.seg .y.on{background:var(--ylw);color:#16213a;font-weight:700}
.seg .r.on{background:var(--red);color:#fff;font-weight:700}
.chk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:left;font:inherit;color:var(--ink);width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;min-height:64px}
.chk .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-weight:700}
.chk.on .box{background:var(--grn);border-color:var(--grn);color:#fff}
.chk.on{background:color-mix(in srgb,var(--grn) 10%,var(--card))}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk .hd{font-size:13px;color:var(--mute);text-align:center}
.cell{font:inherit;color:var(--ink);aspect-ratio:1/1.05;min-height:44px;border:1px solid var(--line);border-radius:10px;cursor:pointer;display:grid;align-content:space-between;justify-items:center;padding:5px 2px;background:linear-gradient(to top,color-mix(in srgb,var(--grn) 38%,var(--card)) var(--p),var(--card) var(--p))}
.cell b{font-size:16px;line-height:1}
.cell.rev{border-style:dashed}
.cell.now b{background:var(--hi);color:var(--hiink);border-radius:9px;padding:2px 6px}
.cell.sel{outline:3px solid var(--acc);outline-offset:1px}
.dots{display:flex;gap:2px;font-size:13px;color:var(--mute);min-height:8px}
.dots i{width:8px;height:8px;border-radius:50%}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.chip{flex:none;font:inherit;font-size:14px;min-height:44px;padding:0 12px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:flex;align-items:center;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.chip span{margin-left:6px;opacity:.7;font-size:13px}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.li:first-child{border-top:0}
.sd{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.sd.g{background:var(--grn);border-color:var(--grn)}.sd.y{background:var(--ylw);border-color:var(--ylw)}.sd.r{background:var(--red);border-color:var(--red)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(7em,1fr));gap:8px}
.nums div{background:var(--paper);border-radius:10px;padding:8px 10px}
.nums b{display:block;font-size:22px;line-height:1.15;white-space:nowrap}
.nums span{font-size:13px;color:var(--mute)}
.trow{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 3.6em;gap:8px;align-items:center;font:inherit;font-size:14px;color:var(--ink);background:none;border:0;width:100%;text-align:left;min-height:40px;cursor:pointer;padding:0}
.trow .bar{height:12px;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.trow .bar i{display:block;height:100%}
.trow em{font-style:normal;text-align:right;white-space:nowrap;color:var(--mute)}
.dbars{display:flex;gap:3px;align-items:flex-end;height:120px}
.dbars button{flex:1;border:1px solid var(--line);border-radius:4px 4px 0 0;padding:0;cursor:pointer;background:linear-gradient(to top,var(--grn) var(--p),var(--card) var(--p));min-width:0}
.dbars button.now{border-color:var(--ink);border-width:2px}
.vizbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=password]{font:inherit;font-size:16px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px;flex:1 1 200px}
input[type=range]{width:100%;height:44px;accent-color:var(--acc);margin:0}
.fig{position:relative;height:clamp(260px,56vw,380px);background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:14px;margin:10px 0 0;overflow:hidden;touch-action:pan-y}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.fig svg text{font-family:"IBM Plex Sans",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3px}
.ctl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ctl .btn{padding:0 4px}
.msg{min-height:4.6em;font-size:16px;margin:8px 0;padding:10px 12px;border-left:4px solid var(--hi);background:var(--paper);border-radius:0 10px 10px 0}
pre{font:14px/1.6 "IBM Plex Mono",monospace;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 0;margin:0;overflow-x:auto}
pre span{display:block;padding:0 12px;white-space:pre}
pre span.on{background:var(--hi);color:var(--hiink)}
.qz p{margin:0 0 6px;font-weight:600}
.qz button{display:block;width:100%;text-align:left;font:inherit;font-size:15px;min-height:44px;margin:4px 0;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.qz button.ok{background:color-mix(in srgb,var(--grn) 22%,var(--card));border-color:var(--grn)}
.qz button.no{background:color-mix(in srgb,var(--red) 18%,var(--card));border-color:var(--red)}
.qz .why{font-size:14px;color:var(--mute);margin-top:4px}
.empty{color:var(--mute);font-size:15px}
#tbar{position:fixed;left:8px;right:8px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--acc);color:var(--accink);border-radius:14px;padding:8px 8px 8px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
#tbar b{font:600 20px "IBM Plex Mono",monospace}
#tbar .tn{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tbar.over{background:var(--red);color:#fff}

.sync{font-size:13px;margin-top:2px;opacity:.85;display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mute)}
.sync[data-s=ok]::before{background:var(--grn)}.sync[data-s=saving]::before,.sync[data-s=load]::before{background:var(--hi)}.sync[data-s=err]::before{background:#ff6b6b}
.card,.q,.chk{border-radius:18px;box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 6%,transparent)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.wd{font:inherit;font-size:13px;color:var(--mute);background:none;border:0;border-radius:12px;padding:6px 0;display:grid;justify-items:center;gap:2px;cursor:pointer;min-height:44px}
.wd.on{background:var(--paper);color:var(--ink);font-weight:700;outline:2px solid var(--acc)}
.streak{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font-size:14px}
.focus{border-radius:22px;padding:18px;background:color-mix(in srgb,var(--tc) 13%,var(--card));border:2px solid var(--tc)}
.fk{font-size:14px;font-weight:600;color:var(--mute)}
.fn{font-size:clamp(22px,5.6vw,28px);font-weight:700;line-height:1.15;letter-spacing:-.01em;margin:4px 0;text-wrap:balance}
.fm{font-size:14px;color:var(--mute)}
.fclk{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.fclk b{font:600 clamp(40px,12vw,56px)/1 "IBM Plex Mono",monospace}
.fbar{height:10px;border-radius:5px;background:var(--card);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.fbar i{display:block;height:100%;width:0;background:var(--grn)}
.fbar.over i{background:var(--red)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:8px;margin:14px 0 12px}
.fl{font-size:14px;font-weight:600;margin-bottom:6px}
.focus .seg button{background:var(--card)}
.qr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;font-size:15px;color:var(--ink);background:none;border:0;border-top:1px solid var(--line);min-height:48px;padding:6px 4px;cursor:pointer}
.qr:first-of-type{border-top:0}
.qr.on{background:var(--paper);font-weight:600;border-radius:10px}
.sw{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.sw button{font:inherit;font-size:15px;min-height:44px;border:0;background:var(--card);color:var(--mute);cursor:pointer}
.sw button.on{background:var(--acc);color:var(--accink);font-weight:700}
#jsvg{display:block;width:100%}
#jsvg text{font-family:"IBM Plex Sans",sans-serif;fill:var(--ink)}
#jsvg g{cursor:pointer}
.msg.ask{border-left-color:var(--blue);cursor:pointer;font-weight:600}

.hbtns{display:flex;align-items:center;gap:8px;flex:none}
body.timing{padding-bottom:150px}
#opts{margin-bottom:14px}
#opts h3{margin-top:14px}#opts h3:first-child{margin-top:0}
.brow{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr));gap:8px;margin-top:8px}
.banner{border-radius:18px;padding:14px;background:color-mix(in srgb,var(--ylw) 16%,var(--card));border:1px solid var(--ylw)}
.cell.off{border-style:dotted;cursor:default;color:var(--mute);font-size:13px;align-content:center;background:var(--paper)}
.cell.blank{border:0;background:none;cursor:default}
textarea{font:inherit;font-size:16px;width:100%;min-height:64px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 10px;margin-top:12px;resize:vertical}
.note{font-size:14px;margin-top:8px}.note summary{cursor:pointer;min-height:36px;color:var(--mute)}
@media(min-width:900px){body{padding-bottom:0}.tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line)}.tabs{max-width:none;justify-content:center;grid-template-columns:repeat(5,minmax(0,200px))}.tabs button{display:flex;justify-content:center;align-items:center;gap:8px;font-size:15px;min-height:52px}.tabs .bdg{position:static}.tabs button.on::before{top:auto;bottom:0;border-radius:3px 3px 0 0}.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}#tbar{left:auto;right:16px;bottom:16px;width:360px}.cell{aspect-ratio:auto;min-height:64px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="in"><div><h1>A2Z Visual Studio</h1><div class="sub" id="sub"></div><div class="sync" id="sync" data-s="local">Saved on this device only</div></div><div class="hbtns"><button class="btn" data-act="opts" id="bopt">Options</button><div id="hring"></div></div></div></header>
<nav class="tabs" id="tabs" aria-label="Sections">
<button data-nav="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>Today</button>
<button data-nav="plan"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Journey</button>
<button data-nav="learn"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>Learn</button>
<button data-nav="review"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5l2-2v6h-6l2-2a5 5 0 0 0-9 3M20 12a8 8 0 0 1-14 5"/></svg>Review<span class="bdg" id="bdg" hidden></span></button>
<button data-nav="stats"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Progress</button>
</nav>
<main class="wrap">
<section class="card" id="opts" hidden></section>
<section class="view" id="v-today"></section>
<section class="view" id="v-plan" hidden></section>
<section class="view" id="v-learn" hidden>
<h2>Pick a topic</h2>
<div class="chips" id="chips"></div>
<div class="cols" style="margin-top:10px">
<div class="card">
<h3 id="vtitle"></h3>
<div class="vizbar"><input type="text" id="inp" aria-label="Your own input" autocomplete="off" spellcheck="false"><button class="btn" id="run">Run</button></div>
<div class="chips" id="modes" style="margin-top:8px" hidden></div>
<div class="small" id="hint" style="margin-top:4px"></div>
<div class="fig" id="fig"><svg id="svg"></svg></div>
<input type="range" id="scr" min="0" max="0" value="0" aria-label="Step">
<div class="small" id="stepn"></div>
<div class="msg" id="msg"></div>
<div class="ctl">
<button class="btn" id="b0" aria-label="Restart">⟲</button>
<button class="btn" id="bp" aria-label="Previous step">◀</button>
<button class="btn pri" id="bplay">▶ Play</button>
<button class="btn" id="bn" aria-label="Next step">▶</button>
<button class="btn" id="bspd" aria-label="Speed">1×</button>
</div>
<button class="btn wide" id="bpred" style="margin-top:8px" aria-pressed="false">Predict mode: off</button>
<div class="small" style="margin-top:6px">Swipe the drawing to step, drag the slider to jump. Predict mode hides each explanation until you have guessed it.</div>
</div>
<div class="stack">
<div class="card"><h3>Code, line by line</h3><pre id="code"></pre></div>
<div class="card"><h3 id="qzh">Quick check</h3><div class="stack" id="quiz"></div></div>
</div>
</div>
<h2 id="tqs"></h2>
<div class="stack" id="tlist"></div>
</section>
<section class="view" id="v-review" hidden></section>
<section class="view" id="v-stats" hidden></section>
</main>

// 3 Recursion subsets
V[3]={title:'Subsets: pick / not pick recursion tree',def:'1, 2, 3',hint:'Up to 4 numbers',
code:['def f(i, cur):','    if i == n: output(cur); return','    f(i+1, cur + [arr[i]])   # pick','    f(i+1, cur)              # not pick'],
steps(s){const a=parseNums(main(s)).slice(0,4);const n=a.length;const st=[];const vis=[];const out=[];

f(i+1,[...cur,a[i]],path+'1');st.push({a,n,vis:[...vis],cur:path,out:[...out],line:3,msg:`Back at f(${i}). Now try NOT picking ${a[i]}.`});f(i+1,cur,path+'0')};

V[4]={title:'Reverse a linked list (prev / curr / next)',def:'1, 2, 3, 4, 5',hint:'Up to 7 values',

V[5]={title:'Merge overlapping intervals (sort, then sweep)',def:'1-3, 2-6, 8-10, 15-18, 9-12',hint:'start-end pairs',
code:['sort intervals by start','for [s, e] in intervals:','    if res is empty or s > res[-1].end: res.append([s, e])','    else: res[-1].end = max(res[-1].end, e)'],
steps(s){const iv=main(s).split(/[ ,]+/).map(p=>p.split('-').map(Number)).filter(p=>p.length===2&&!isNaN(p[0])&&!isNaN(p[1])).slice(0,8).map(([a,b])=>[Math.min(a,b),Math.max(a,b)]);iv.sort((p,q)=>p[0]-q[0]);const st=[];const res=[];st.push({iv,res:[],i:-1,line:0,msg:'Sorted by start time, so any overlap must be with the last merged interval.'});

draw(W,H,z){let s='';if(!z.iv.length)return T(W/2,H/2,'Enter intervals like 1-3, 2-6');const mn=Math.min(...z.iv.map(p=>p[0])),mx=Math.max(...z.iv.map(p=>p[1]));const X=v=>24+(v-mn)/(mx-mn||1)*(W-48);const rh=Math.min(30,(H-130)/z.iv.length);

const yr=H-80;s+=T(24,yr-14,'merged',{a:'start',fs:13,fill:C.mute});z.res.forEach(([a,b])=>{s+=R(X(a),yr,Math.max(4,X(b)-X(a)),30,'color-mix(in srgb,var(--grn) 35%,var(--card))',C.grn,4)+T((X(a)+X(b))/2,yr+15,`${a}-${b}`,{fs:13,w:600})});

// 6 Sliding window
V[6]={title:'Longest substring without repeating characters',def:'abcabcbb',hint:'Any string, up to 14 chars',
code:['l = 0; last = {}; best = 0','for r in range(n):','    if s[r] in last and last[s[r]] >= l: l = last[s[r]] + 1','    last[s[r]] = r','    best = max(best, r - l + 1)'],

V[7]={title:'Next greater element (monotonic stack, right to left)',def:'4, 5, 2, 10, 8',hint:'Up to 10 numbers',
code:['stack = []','for i from n-1 down to 0:','    while stack and stack.top <= arr[i]: pop','    ans[i] = stack.top if stack else -1','    push arr[i]'],
steps(s){const a=parseNums(main(s)).slice(0,10);const st=[];const stk=[];const ans=a.map(()=>null);st.push({a,stk:[],ans:[...ans],i:a.length,line:0,msg:'Walk from the right. The stack keeps candidates in decreasing order.'});

// 8 Binary tree traversals
V[8]={title:'Tree traversals',def:'1, 2, 3, 4, 5, 6, 7',hint:'Level order, use null for gaps',modes:['Preorder','Inorder','Postorder','Level order'],
codeFor:{Preorder:['def pre(node):','    if not node: return','    visit(node)','    pre(node.left)','    pre(node.right)'],Inorder:['def ino(node):','    if not node: return','    ino(node.left)','    visit(node)','    ino(node.right)'],Postorder:['def post(node):','    if not node: return','    post(node.left)','    post(node.right)','    visit(node)'],'Level order':['q = [root]','while q:','    node = q.pop(0)','    visit(node)','    push node.left, node.right if they exist']},
steps(s,mode){const vals=main(s).split(/[ ,]+/).filter(x=>x).slice(0,15);const nodes={};vals.forEach((v,i)=>{if(v!=='null'&&(i===0||nodes[Math.floor((i-1)/2)]))nodes[i]={v,l:2*i+1<vals.length?2*i+1:null,r:2*i+2<vals.length?2*i+2:null}});for(const k in nodes){if(!nodes[nodes[k].l])nodes[k].l=null;if(!nodes[nodes[k].r])nodes[k].r=null}
const order=[];const st=[];const visitLine={Preorder:2,Inorder:3,Postorder:4,'Level order':3}[mode];
const rec=id=>{if(id==null||!nodes[id])return;if(mode==='Preorder')vis(id);rec(nodes[id].l);if(mode==='Inorder')vis(id);rec(nodes[id].r);if(mode==='Postorder')vis(id)};
const vis=id=>{order.push(id);st.push({nodes,order:[...order],cur:id,line:visitLine,msg:`Visit ${nodes[id].v}.`+(mode==='Inorder'?' (left subtree is finished)':mode==='Postorder'?' (both children are finished)':'')})};
st.push({nodes,order:[],cur:null,line:0,msg:`${mode}: ${{Preorder:'root, left, right',Inorder:'left, root, right — gives sorted order in a BST',Postorder:'left, right, root — children before parent','Level order':'level by level using a queue'}[mode]}.`});

st.push({nodes,order,cur:null,line:0,msg:`${mode}: ${order.map(i=>nodes[i].v).join(', ')}. Every node once → O(n).`});return st},
draw(W,H,z){let s='';const pos=treeLayout(z.nodes,W,H-70,34);for(const id in z.nodes){const n=z.nodes[id];[n.l,n.r].forEach(c=>{if(c!=null&&pos[c])s+=L(pos[id].x,pos[id].y,pos[c].x,pos[c].y,C.line,2)})}
for(const id in z.nodes){const k=z.order.indexOf(+id);const on=+id===z.cur;s+=CI(pos[id].x,pos[id].y,17,on?C.hi:(k>=0?'color-mix(in srgb,var(--grn) 25%,var(--card))':C.card),on?C.ink:C.mute)+T(pos[id].x,pos[id].y,z.nodes[id].v,{fs:14,w:600});if(k>=0)s+=T(pos[id].x+20,pos[id].y-18,k+1,{fs:11,w:700,fill:C.grn})}
s+=T(12,H-28,'order: '+z.order.map(i=>z.nodes[i].v).join(' → '),{a:'start',fs:14,w:600});return s}};

// 10 Heap
V[10]={title:'Min-heap insert (add at the end, sift up)',def:'5, 3, 8, 1, 9, 2',hint:'Up to 10 numbers',
code:['heap.append(x); i = last index','while i > 0 and heap[parent(i)] > heap[i]:','    swap(heap[i], heap[parent(i)])','    i = parent(i)        # parent(i) = (i-1)//2'],
steps(s){const a=parseNums(main(s)).slice(0,10);const h=[];const st=[];a.forEach(x=>{h.push(x);let i=h.length-1;st.push({h:[...h],i,line:0,msg:`Insert ${x} at the end (index ${i}).`});while(i>0&&h[(i-1)>>1]>h[i]){const p=(i-1)>>1;st.push({h:[...h],i,p,line:1,msg:`Parent ${h[p]} > ${h[i]} → heap rule broken.`});[h[i],h[p]]=[h[p],h[i]];i=p;st.push({h:[...h],i,line:2,msg:'Swap up.'})}st.push({h:[...h],i,line:1,msg:`${x} is in place. Smallest is at the top: ${h[0]}.`})});st.push({h,line:0,msg:`Heap built. Each insert is O(log n); the array is the tree, no pointers.`});return st},

V[11]={title:'Longest common subsequence (DP table)',def:'abcde | ace',hint:'two words: first | second (up to 7 letters)',

steps(s){const parts=s.split('|');const a=[...(parts[0]||'abcde').trim()].slice(0,7),b=[...(parts[1]||'ace').trim()].slice(0,7);const n=a.length,m=b.length;const dp=Array.from({length:n+1},()=>Array(m+1).fill(null));for(let i=0;i<=n;i++)dp[i][0]=0;for(let j=0;j<=m;j++)dp[0][j]=0;const st=[];const cp=()=>dp.map(r=>[...r]);

st.push({a,b,dp:cp(),ci:n,cj:m,line:4,msg:`LCS length = ${dp[n][m]}. Table is (n+1)×(m+1) → O(n·m) time and space.`});return st},
draw(W,H,z){let s='';const rows=z.a.length+2,cols=z.b.length+2;const cs=Math.min(46,(W-20)/cols,(H-20)/rows);const x0=(W-cs*cols)/2,y0=(H-cs*rows)/2;

V[12]={title:'Trie: insert words letter by letter',def:'app, apple, bat, bad',hint:'Comma-separated words',

V[14]={title:'Sieve of Eratosthenes',def:'n=60',hint:'n = up to 100',
code:['prime[2..n] = True','for p from 2 while p*p <= n:','    if prime[p]:','        for m from p*p to n step p: prime[m] = False','primes = all p still True'],
steps(s){const n=Math.min(100,Math.max(10,+kv(s,'n',60)));const cross={};const st=[];st.push({n,cross:{},p:0,line:0,msg:`Assume every number from 2 to ${n} is prime.`});
